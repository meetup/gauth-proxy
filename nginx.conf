user  nginx;
worker_processes  auto;

pid /run/nginx.pid;

load_module /usr/lib/nginx/modules/ndk_http_module.so;
load_module /usr/lib/nginx/modules/ngx_http_lua_module.so;

# nginx only exposes variables listed here to the Lua scripts
env NGO_CALLBACK_HOST;
env NGO_CALLBACK_SCHEME;
env NGO_CALLBACK_URI;
env NGO_SIGNOUT_URI;
env NGO_CLIENT_ID;
env NGO_CLIENT_SECRET;
env NGO_TOKEN_SECRET;
env NGO_SECURE_COOKIES;
env NGO_HTTP_ONLY_COOKIES;
env NGO_EXTRA_VALIDITY;
env NGO_DOMAIN;
env NGO_WHITELIST;
env NGO_BLACKLIST;
env NGO_USER;
env NGO_EMAIL_AS_USER;
env NGINX_PROXY_PASS;

events {
  worker_connections 768;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  ssl_prefer_server_ciphers on;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  gzip on;
  gzip_disable "msie6";

  include /etc/nginx/conf.d/*.conf;
}
